name: test

on:
  - push
  - pull_request

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.18
      - name: Checkout
        uses: actions/checkout@v2
      -
        name: Go test
        run: go test ./...

  sh-test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.18
      - name: Checkout
        uses: actions/checkout@v2
      -
        name: Go build
        run: go build
      -
        name: Install gron
        run: go install github.com/tomnomnom/gron@latest
      -
        name: Test
        run: bash tools/test.sh
